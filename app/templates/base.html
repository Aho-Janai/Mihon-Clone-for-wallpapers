<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% if title %}{{ title }} - Wallpapers{% else %}Wallpapers{% endif %}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-50 min-h-screen">
    <header class="bg-gradient-to-r from-gray-800 via-gray-700 to-gray-800 border-b border-white/10 py-6 px-4 text-center">
        <a href="{{ url_for('index') }}">
            <h1 class="text-3xl font-bold uppercase tracking-widest">Wallpapers</h1>
        </a>
    </header>
    <main class="max-w-6xl mx-auto p-4">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
