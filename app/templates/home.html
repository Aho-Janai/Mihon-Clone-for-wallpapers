{% extends "base.html" %}

{% block content %}
<h2 class="text-xl font-semibold mb-4">Sources</h2>
<ul class="grid gap-4 sm:grid-cols-2 md:grid-cols-3">
    {% for source in sources %}
    <li>
        <a href="{{ url_for('source_detail', source_id=source.id) }}"
           class="block rounded-lg bg-gray-800 hover:bg-gray-700 p-5 border border-white/10 transition">
            <span class="text-lg font-medium">{{ source.name }}</span>
            <span class="block text-sm text-gray-400 mt-1">id: {{ source.id }}</span>
        </a>
    </li>
    {% else %}
    <li class="text-gray-400">No sources registered.</li>
    {% endfor %}
</ul>
{% endblock %}
